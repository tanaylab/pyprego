name: Build and publish conda packages

on:
  workflow_run:
    workflows: ["Build and publish to PyPI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (without v prefix)"
        required: true

jobs:
  build_conda:
    name: conda (${{ matrix.os }}, py${{ matrix.python }}, np${{ matrix.numpy }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.10", "3.11", "3.12"]
        numpy: ["1.26", "2.0", "2.1"]
        exclude:
          - python: "3.10"
            numpy: "2.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          python-version: ${{ matrix.python }}
          activate-environment: base
          auto-activate: true

      # Into base, and with base activated: conda-build extends the conda CLI of
      # the environment it is installed into, so installing it in a non-base env
      # left `conda build` an invalid subcommand. conda build makes its own build
      # env from --python/--numpy, so base's interpreter is not the one used.
      - name: Install conda-build and anaconda-client
        run: conda install -n base -y conda-build anaconda-client

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download sdist from PyPI and patch meta.yaml
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          SDIST_URL="https://pypi.io/packages/source/p/pyprego/pyprego-${PACKAGE_VERSION}.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -sSLf -o pyprego-sdist.tar.gz "$SDIST_URL"; then
              break
            fi
            if [ $i -eq 5 ]; then exit 1; fi
            sleep $((i * 30))
          done
          if command -v sha256sum &>/dev/null; then
            SHA256=$(sha256sum pyprego-sdist.tar.gz | awk '{print $1}')
          else
            SHA256=$(shasum -a 256 pyprego-sdist.tar.gz | awk '{print $1}')
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sed -i "s/SET_ON_RELEASE/${SHA256}/" conda-recipe/meta.yaml
          else
            sed -i '' "s/SET_ON_RELEASE/${SHA256}/" conda-recipe/meta.yaml
          fi

      - name: Build conda package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          conda build conda-recipe/ \
            --python ${{ matrix.python }} \
            --numpy ${{ matrix.numpy }} \
            --no-anaconda-upload \
            --output-folder conda-output/

      - name: Upload to anaconda.org
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          shopt -s nullglob
          PACKAGES=( conda-output/**/*.tar.bz2 conda-output/**/*.conda )
          if [ ${#PACKAGES[@]} -eq 0 ]; then exit 1; fi
          anaconda -t "$ANACONDA_TOKEN" upload \
            --user aviezerl \
            --label main \
            --force \
            "${PACKAGES[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: conda-pkg-${{ matrix.os }}-py${{ matrix.python }}-np${{ matrix.numpy }}
          path: |
            conda-output/**/*.tar.bz2
            conda-output/**/*.conda
