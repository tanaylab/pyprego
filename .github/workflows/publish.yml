name: Build and publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build_wheels_linux:
    name: Build wheels on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-win* *-musllinux* *i686*"
          CIBW_ARCHS: x86_64
          CIBW_BUILD_VERBOSITY: 1
          # manylinux2014 ships GCC 10.2, and NumPy's build now requires >= 10.3.
          # Since numpy is an unpinned build requirement and recent versions have
          # no manylinux2014 wheel, pip fell back to compiling it from source and
          # the build failed before reaching pyprego's own sources. manylinux_2_28
          # ships GCC 12; it raises the Linux glibc floor from 2.17 to 2.28,
          # i.e. RHEL 8 / Ubuntu 18.10 and newer.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build_wheels_macos:
    name: Build wheels on macOS
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          CIBW_SKIP: "*-win* *-musllinux* *i686*"
          CIBW_ARCHS: arm64
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheels-macos
          path: ./wheelhouse/*.whl
          if-no-files-found: ignore

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels_linux, build_wheels_macos, build_sdist]
    if: always() && needs.build_wheels_linux.result == 'success' && needs.build_sdist.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
