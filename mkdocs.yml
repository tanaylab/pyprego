site_name: pyprego
site_url: https://tanaylab.github.io/pyprego/
repo_url: https://github.com/tanaylab/pyprego
repo_name: tanaylab/pyprego

theme:
  name: material
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Getting Started: guides/quickstart.md
  - Tutorials:
      - Motif Discovery: tutorials/motif-discovery.md
      - K-mer Analysis: tutorials/kmer-analysis.md
      - Working with PSSMs: tutorials/pssm-operations.md
      - Genomic Integration: tutorials/genomic-integration.md
  - Reference:
      - R Parity: guides/parity.md
      - Changelog: changelog.md
  - API Reference:
      - Overview: api/index.md
      - Regression: api/regression.md
      - PWM Scoring: api/compute.md
      - K-mer Operations: api/kmers.md
      - PSSM Utilities: api/pssm.md
      - Motif Database: api/motif-db.md
      - Visualization: api/visualization.md
      - Genomic: api/genomic.md
      - Export/Import: api/export.md
      - Types: api/types.md
